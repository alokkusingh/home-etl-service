    kotak-account-imported: "${file.path.base.dir}/Kotak/exported"
    kotak-account-imported-v3: "${file.path.base.dir}/Kotak/exported/v3"
    hdfc-account-imported: "${file.path.base.dir}/HDFC/exported"
    expense: "${file.path.base.dir}/expense"
    tax: "${file.path.base.dir}/tax"
    investment: "${file.path.base.dir}/investment"

web:
  cache-control:
    max-age: 30

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: "always"
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

