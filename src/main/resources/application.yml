application:
  id: "home-etl-service"

server:
  port: 8081
  servlet:
    context-path: "/home/etl"

spring:
  profiles:
    active: dev
  application:
    name: "home-etl-service"
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: "UTC"
  batch:
    job:
      enabled: false

# If you enable below config - after reading data from DB Jackson will
# convert data in the IST otherwise in UTC
# Ideally should be UTC, let client convert based on their local value
#spring.jackson.time-zone=IST

# Application configuration
fields:
  name:
    student: "id,name,department,marks"
    missing-account: "date,description,debit,credit"
    manual-account: "date,description,debit,credit,head,subHead,bank,isSalary,file"
    kotak-account-imported: "slNo,date,description,chqRefNumber,amount,drCr,balance,balanceDrCr"
    kotak-account-imported-v2: "slNo,trDate,date,description,chqRefNumber,amount,drCr,balance,balanceDrCr"
    kotak-account-imported-v3: "slNo,trDate,date,description,chqRefNumber,debitAmount,creditAmount,closingBalance,drCr"
    hdfc-account-imported: "date,narration,valueDate,debitAmount,creditAmount,chqRef,closingBalance"
    expense: "date,head,amount,comment,year,month"
    tax: "financialYear,paidAmount,refundAmount"
    # fields.name.investment=year,month,pfContribution,pfSubTotal,pfValueAsOnMonth,licContribution,licSubTotal,licValueAsOnMonth,npsContribution,npsSubTotal,npsValueAsOnMonth,shareContribution,shareSubTotal,shareValueAsOnMonth,,,,,,
    investment: "year,month,pfContribution,,pfValueAsOnMonth,licContribution,,licValueAsOnMonth,npsContribution,,npsValueAsOnMonth,shareContribution,,shareValueAsOnMonth,,,,,,,"

