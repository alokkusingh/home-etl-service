spring:
  debug: true
  datasource:
    url: "jdbc:h2:~/test-v8;AUTO_SERVER=TRUE"
    username: "sa"
    password: ""
    driver-class-name: "org.h2.Driver"
  jpa:
    properties:
      hibernate:
        dialect: "org.hibernate.dialect.H2Dialect"
        format_sql: true
        id:
          new_generator_mappings: true
    show-sql: true
    hibernate:
      ddl-auto: "update"
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
  sql:
    init:
      mode: "always"
  batch:
    jdbc:
      initialize-schema: "always"
    initialize-schema: "always"

flyway:
  enabled: false
  #flyway.locations=db/migration/h2
  locations: "~/test-v8"
  baselineOnMigrate: true

# ---------------------- Auth URL ------------------------------
auth:
  url: "http://localhost:8082/home/auth/google/validate/id-token"

#----------------------- gRPC -----------------------------------
grpc:
  client:
    exp-cat-grpc-server:
      address: "static://127.0.0.1:5051"
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: "plaintext"
