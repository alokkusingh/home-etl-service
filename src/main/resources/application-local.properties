spring.debug=true
server.port=8081

## MySQL Database
spring.datasource.url=jdbc:mysql://jgte:32306/home-stack
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true

### DB Connection Pooling
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.batch.initialize-schema=always

flyway.locations=~/test
flyway.baselineOnMigrate=true
flyway.enabled=false

# udp host for sender. By default Jaeger libraries use a UDP sender to report finished spans to the jaeger-agent daemon
opentracing.jaeger.udp-sender.host=jaeger-agent
opentracing.jaeger.udp-sender.port=6831
# logs the spans in console
opentracing.jaeger.log-spans=true

# ---------------------- Auth URL ------------------------------
auth.token.issuer.urls.google=https://hdash.alok.world/home/auth/google/validate/id-token
auth.token.issuer.urls.home-stack-auth=https://hdash.alok.world/home/auth/home/token/validate

#----------------------- gRPC -----------------------------------
grpc.client.exp-cat-grpc-server.address=static://127.0.0.1:5051
grpc.client.exp-cat-grpc-server.enableKeepAlive=true
grpc.client.exp-cat-grpc-server.keepAliveWithoutCalls=true
grpc.client.exp-cat-grpc-server.negotiationType=plaintext

logging.level.com.alok.home.batch.writer.BankAccountDbWriter=DEBUG
logging.level.com.alok.home.batch.utils=DEBUG
